<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平安家園 代辦行事曆</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --w-bg:#F5EFE6;--w-sur:#FDF8F2;--w-card:#FFFCF8;
  --w-bd:#DDD0BE;--w-bs:#EAE0D0;
  --w-tx:#2C1F0E;--w-mid:#6B5540;--w-soft:#9C8470;
  --w-ac:#8B5E3C;--w-al:#F0E4D4;--w-at:#5C3A1E;
  --w-tod:#C17A3A;--w-sel:#EDE0CF;--w-done:#C4B5A5;
}
html,body{height:100%;background:var(--w-bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft JhengHei',sans-serif}
body{display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem 3rem}
.outer{width:100%;max-width:860px;background:var(--w-bg);border-radius:18px;overflow:hidden;box-shadow:0 2px 24px rgba(100,60,20,.10)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:var(--w-sur);border-bottom:0.5px solid var(--w-bs)}
.mlabel{font-size:19px;font-weight:500;color:var(--w-tx);letter-spacing:-.3px}
.msubtitle{font-size:12px;color:var(--w-soft);margin-left:10px;font-weight:400;letter-spacing:.2px;white-space:nowrap}
.nav-grp{display:flex;gap:4px}
.nbtn{width:32px;height:32px;border-radius:50%;border:0.5px solid var(--w-bd);background:var(--w-card);cursor:pointer;color:var(--w-mid);display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .13s}
.nbtn:hover{background:var(--w-al)}
.tpill{height:30px;padding:0 13px;border-radius:15px;border:0.5px solid var(--w-bd);background:var(--w-card);cursor:pointer;font-size:12px;font-weight:500;color:var(--w-mid);transition:background .13s}
.tpill:hover{background:var(--w-al)}
.split{display:flex;align-items:flex-start}
.cal-col{flex:0 0 320px;padding:.75rem .75rem 1rem;background:var(--w-sur);border-right:0.5px solid var(--w-bs)}
.wrow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
.wl{text-align:center;font-size:11px;font-weight:500;color:var(--w-soft);padding:5px 0;letter-spacing:.3px}
.wl:first-child{color:#B05A2F}.wl:last-child{color:#5B7FA6}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dc{display:flex;flex-direction:column;align-items:center;padding:5px 2px;cursor:pointer;border-radius:10px;min-height:52px;transition:background .12s}
.dc:hover{background:var(--w-al)}
.dn{font-size:14px;color:var(--w-tx);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.dc.om .dn{color:var(--w-soft);opacity:.4}
.dc.sun:not(.om) .dn{color:#B05A2F}
.dc.sat:not(.om) .dn{color:#5B7FA6}
.dc.tod .dn{background:var(--w-tod);color:#fff;font-weight:500}
.dc.sel:not(.tod) .dn{background:var(--w-sel);color:var(--w-at);font-weight:500}
.dotrow{display:flex;gap:3px;justify-content:center;margin-top:2px;height:6px}
.dot{width:5px;height:5px;border-radius:50%}
.dot-o{background:var(--w-ac)}.dot-d{background:var(--w-done)}
.todo-col{flex:1;min-width:0;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:.75rem}
.tdhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.tddate{font-size:14px;font-weight:500;color:var(--w-tx)}
.tdbadge{font-size:11px;color:var(--w-soft);background:var(--w-sur);border:0.5px solid var(--w-bs);padding:2px 10px;border-radius:10px}
.titem{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:11px;border:0.5px solid var(--w-bs);background:var(--w-card)}
.titem.done{opacity:.5}
.tchk{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--w-bd);background:var(--w-sur);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:background .12s,border-color .12s,color .12s}
.titem.done .tchk{background:var(--w-ac);border-color:var(--w-ac);color:#fff}
.tchk:hover{border-color:var(--w-ac)}
.ttxt{flex:1;font-size:14px;color:var(--w-tx);min-width:0;word-break:break-all;border-left:2.5px solid var(--bar);padding-left:8px;line-height:1.4}
.titem.done .ttxt{text-decoration:line-through;color:var(--w-soft)}
.tdel{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:none;background:var(--w-bg);cursor:pointer;color:var(--w-mid);font-size:16px;flex-shrink:0;transition:background .13s,color .13s}
.tdel:hover{background:#B05A2F;color:#fff}
.empty{padding:1.5rem 0;text-align:center;color:var(--w-soft);font-size:13px}
.ei{font-size:22px;display:block;margin-bottom:5px}
.addbtn{width:100%;padding:9px 13px;border-radius:11px;border:0.5px dashed var(--w-bd);background:var(--w-sur);cursor:pointer;font-size:13px;color:var(--w-mid);display:flex;align-items:center;gap:9px;transition:border-color .13s,background .13s}
.addbtn:hover{border-color:var(--w-ac);background:var(--w-al);color:var(--w-at)}
.pc{width:24px;height:24px;border-radius:50%;background:var(--w-ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.fbox{background:var(--w-card);border:0.5px solid var(--w-bd);border-radius:12px;overflow:hidden}
.fbox.hidden{display:none}
.fhead{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:0.5px solid var(--w-bs);background:var(--w-sur)}
.ftit{font-size:14px;font-weight:500;color:var(--w-tx)}
.fclose{width:26px;height:26px;border-radius:50%;border:0.5px solid var(--w-bd);background:var(--w-bg);cursor:pointer;color:var(--w-mid);display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .13s}
.fclose:hover{background:var(--w-al)}
.fbody{padding:13px 14px;display:flex;flex-direction:column;gap:10px}
.flabel{font-size:11px;font-weight:500;color:var(--w-soft);margin-bottom:4px;display:block;letter-spacing:.3px}
.finput{width:100%;padding:8px 10px;border:0.5px solid var(--w-bs);border-radius:8px;background:var(--w-sur);color:var(--w-tx);font-size:14px;font-family:inherit;transition:border-color .15s}
.finput:focus{outline:none;border-color:var(--w-ac)}
.cgrid{display:flex;gap:8px;margin-top:4px}
.copt{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .12s,transform .11s}
.copt:hover{transform:scale(1.12)}.copt.on{border-color:var(--w-tx)}
.ffoot{padding:10px 14px;border-top:0.5px solid var(--w-bs);background:var(--w-sur);display:flex;gap:8px;align-items:center}
.bcnl{flex:1;padding:8px;border:0.5px solid var(--w-bd);border-radius:8px;background:var(--w-bg);cursor:pointer;font-size:13px;color:var(--w-mid);transition:background .13s}
.bcnl:hover{background:var(--w-al)}
.bsav{flex:2;padding:8px;border:none;border-radius:8px;background:var(--w-ac);cursor:pointer;font-size:13px;color:#fff;font-weight:500;transition:opacity .13s}
.bsav:hover{opacity:.88}.bsav:disabled{opacity:.5;cursor:not-allowed}
.smsg{font-size:11px;color:var(--w-soft);min-width:48px;text-align:right}
.sbar{font-size:11px;text-align:center;padding:5px 0;min-height:20px;color:var(--w-soft)}
.sbar.err{color:#B05A2F}.sbar.ok{color:#5A7A45}
@media(max-width:640px){
  body{padding:.75rem .5rem 2rem}
  .split{flex-direction:column}
  .cal-col{flex:none;width:100%;border-right:none;border-bottom:0.5px solid var(--w-bs)}
  .todo-col{padding:.875rem 1rem}
}
</style>
</head>
<body>
<div class="outer">
  <div class="topbar">
    <div style="display:flex;align-items:baseline;gap:0">
      <span class="mlabel" id="calTitle"></span>
      <span class="msubtitle">岱江里C據點行事曆</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="tpill" onclick="goToday()">今天</button>
      <div class="nav-grp">
        <button class="nbtn" onclick="chM(-1)" aria-label="上個月"><i class="ti ti-chevron-left"></i></button>
        <button class="nbtn" onclick="chM(1)" aria-label="下個月"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
  </div>
  <div class="split">
    <div class="cal-col">
      <div class="wrow">
        <div class="wl">日</div><div class="wl">一</div><div class="wl">二</div>
        <div class="wl">三</div><div class="wl">四</div><div class="wl">五</div><div class="wl">六</div>
      </div>
      <div class="days" id="daysGrid"></div>
    </div>
    <div class="todo-col">
      <div class="tdhead">
        <span class="tddate" id="tdDate"></span>
        <span class="tdbadge" id="tdBadge"></span>
      </div>
      <div id="tdList"></div>
      <div id="addWrap">
        <button class="addbtn" onclick="openForm()">
          <span class="pc"><i class="ti ti-plus"></i></span>新增代辦
        </button>
      </div>
      <div class="fbox hidden" id="fbox">
        <div class="fhead">
          <span class="ftit">新增代辦事項</span>
          <button class="fclose" onclick="closeForm()" aria-label="關閉"><i class="ti ti-x"></i></button>
        </div>
        <div class="fbody">
          <div><label class="flabel">內容</label><input class="finput" id="fTitle" type="text" placeholder="輸入代辦內容…"></div>
          <div><label class="flabel">日期</label><input class="finput" id="fDate" type="date"></div>
          <div>
            <label class="flabel">顏色</label>
            <div class="cgrid">
              <div class="copt on" data-c="rust" style="background:#B05A2F" onclick="pickC(this)"></div>
              <div class="copt" data-c="moss" style="background:#5A7A45" onclick="pickC(this)"></div>
              <div class="copt" data-c="dusk" style="background:#5B7FA6" onclick="pickC(this)"></div>
              <div class="copt" data-c="clay" style="background:#9E6B40" onclick="pickC(this)"></div>
              <div class="copt" data-c="plum" style="background:#7A5580" onclick="pickC(this)"></div>
            </div>
          </div>
        </div>
        <div class="ffoot">
          <button class="bcnl" onclick="closeForm()">取消</button>
          <button class="bsav" id="bsav" onclick="saveItem()">儲存</button>
          <span class="smsg" id="smsg"></span>
        </div>
      </div>
      <div class="sbar" id="sbar"></div>
    </div>
  </div>
</div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbwjKQ9gsg9qmP31fEZPrGbQwUIMquHpwrQWyPLkXLoteSukA0WdpyCterM1Lx1df2H_rw/exec';
const LSK='cal-todo-gas-v4';
const CM={rust:'#B05A2F',moss:'#5A7A45',dusk:'#5B7FA6',clay:'#9E6B40',plum:'#7A5580'};
const MO=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const DW=['日','一','二','三','四','五','六'];
const td=new Date();
let cur=new Date(td.getFullYear(),td.getMonth(),1);
let sel=new Date(td.getFullYear(),td.getMonth(),td.getDate());
let sc='rust',items=[];

const p2=n=>n<10?'0'+n:''+n;
const fd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const addD=(d,n)=>{let r=new Date(d);r.setDate(r.getDate()+n);return r};
const sD=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();

function lsLoad(){try{const r=localStorage.getItem(LSK);if(r){items=JSON.parse(r);return true;}}catch(e){}return false;}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify(items));}catch(e){}}

function sbar(msg,cls){
  const el=document.getElementById('sbar');
  el.textContent=msg;el.className='sbar'+(cls?' '+cls:'');
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cbName='_cb'+Date.now()+'_'+Math.floor(Math.random()*9999);
    const timer=setTimeout(()=>{delete window[cbName];reject(new Error('timeout'));},15000);
    window[cbName]=function(data){clearTimeout(timer);delete window[cbName];resolve(data);};
    const qs=Object.entries({...params,callback:cbName}).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    const s=document.createElement('script');
    s.src=GAS+'?'+qs;
    s.onerror=()=>{clearTimeout(timer);delete window[cbName];reject(new Error('script error'));};
    document.head.appendChild(s);
    setTimeout(()=>{if(s.parentNode)s.parentNode.removeChild(s);},20000);
  });
}

async function load(){
  lsLoad();render();
  sbar('連線 Google Sheet 中…');
  try{
    const res=await jsonp({action:'getAll'});
    if(res.ok){
      items=res.items.map(i=>({...i,done:i.done===true||i.done==='TRUE'||i.done==='true'}));
      lsSave();render();sbar('');
    }else{sbar('Sheet 讀取失敗：'+res.error,'err');}
  }catch(e){sbar('網路錯誤，顯示本機快取','err');}
}

function render(){
  const yr=cur.getFullYear(),mo=cur.getMonth();
  document.getElementById('calTitle').textContent=yr+'年 '+(mo+1)+'月';
  const grid=document.getElementById('daysGrid');grid.innerHTML='';
  const dm={};
  items.forEach(e=>{if(!dm[e.date])dm[e.date]={o:0,d:0};e.done?dm[e.date].d++:dm[e.date].o++;});
  const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0),sd=first.getDay();
  for(let i=0;i<sd;i++) grid.appendChild(mkCell(new Date(yr,mo,1-sd+i),true,dm));
  for(let d=1;d<=last.getDate();d++) grid.appendChild(mkCell(new Date(yr,mo,d),false,dm));
  const rem=(7-(last.getDay()+1)%7)%7;
  for(let i=1;i<=rem;i++) grid.appendChild(mkCell(new Date(yr,mo+1,i),true,dm));
  renderTodos();
}

function mkCell(dt,om,dm){
  const c=document.createElement('div');
  c.className='dc'+(om?' om':'');
  const dow=dt.getDay();
  if(dow===0&&!om)c.classList.add('sun');
  if(dow===6&&!om)c.classList.add('sat');
  if(sD(dt,td))c.classList.add('tod');
  if(sD(dt,sel))c.classList.add('sel');
  const n=document.createElement('div');n.className='dn';n.textContent=dt.getDate();c.appendChild(n);
  const ds=fd(dt);
  if(dm[ds]){
    const dr=document.createElement('div');dr.className='dotrow';
    for(let i=0;i<Math.min(dm[ds].o,3);i++){const d=document.createElement('div');d.className='dot dot-o';dr.appendChild(d);}
    if(dm[ds].d){const d=document.createElement('div');d.className='dot dot-d';dr.appendChild(d);}
    c.appendChild(dr);
  }
  c.onclick=()=>{sel=new Date(dt);if(om){cur=new Date(dt.getFullYear(),dt.getMonth(),1);}closeForm();render();};
  return c;
}

function renderTodos(){
  const ds=fd(sel);
  document.getElementById('tdDate').textContent=sel.getFullYear()+'年'+MO[sel.getMonth()]+sel.getDate()+'日（'+DW[sel.getDay()]+'）';
  const list=items.filter(e=>e.date===ds);
  const open=list.filter(e=>!e.done).length;
  const el=document.getElementById('tdList');el.innerHTML='';
  document.getElementById('tdBadge').textContent=list.length?(open?open+'項待完成':'全部完成 ✓'):'無事項';
  if(!list.length){el.innerHTML='<div class="empty"><i class="ti ti-check ei"></i>今日清閒</div>';return;}
  [...list.filter(e=>!e.done),...list.filter(e=>e.done)].forEach(e=>{
    const bar=CM[e.color]||CM.rust;
    const d=document.createElement('div');
    d.className='titem'+(e.done?' done':'');
    d.style.setProperty('--bar',bar);
    d.innerHTML=`<button class="tchk" onclick="toggleDone('${e.id}')" aria-label="${e.done?'標記未完成':'標記完成'}">${e.done?'<i class="ti ti-check"></i>':''}</button>
<span class="ttxt">${e.title}</span>
<button class="tdel" onclick="delItem('${e.id}')" aria-label="刪除"><i class="ti ti-trash"></i></button>`;
    el.appendChild(d);
  });
}

async function toggleDone(id){
  const it=items.find(e=>e.id===id);if(!it)return;
  it.done=!it.done;lsSave();render();
  try{await jsonp({action:'update',id,done:String(it.done)});}
  catch(e){sbar('同步失敗','err');}
}

async function delItem(id){
  items=items.filter(e=>e.id!==id);lsSave();render();
  try{await jsonp({action:'delete',id});}
  catch(e){sbar('同步失敗','err');}
}

function openForm(){
  document.getElementById('fTitle').value='';
  document.getElementById('fDate').value=fd(sel);
  document.getElementById('smsg').textContent='';
  document.getElementById('bsav').disabled=false;
  document.querySelectorAll('.copt').forEach(o=>o.classList.remove('on'));
  document.querySelector('.copt[data-c="rust"]').classList.add('on');
  sc='rust';
  document.getElementById('addWrap').style.display='none';
  document.getElementById('fbox').classList.remove('hidden');
  setTimeout(()=>document.getElementById('fTitle').focus(),50);
}
function closeForm(){
  document.getElementById('fbox').classList.add('hidden');
  document.getElementById('addWrap').style.display='';
}
function pickC(el){
  document.querySelectorAll('.copt').forEach(o=>o.classList.remove('on'));
  el.classList.add('on');sc=el.dataset.c;
}

async function saveItem(){
  const title=document.getElementById('fTitle').value.trim();
  if(!title){document.getElementById('fTitle').focus();document.getElementById('smsg').textContent='請填內容';return;}
  const date=document.getElementById('fDate').value||fd(sel);
  const id=String(Date.now());
  items.push({id,title,date,done:false,color:sc});
  lsSave();
  const pts=date.split('-');
  sel=new Date(+pts[0],+pts[1]-1,+pts[2]);
  cur=new Date(sel.getFullYear(),sel.getMonth(),1);
  closeForm();render();
  sbar('寫入 Sheet 中…');
  document.getElementById('bsav').disabled=true;
  try{
    const res=await jsonp({action:'save',id,title,date,done:'false',color:sc});
    sbar(res.ok?'已同步至 Google Sheet ✓':'寫入失敗：'+(res.error||''),res.ok?'ok':'err');
  }catch(e){sbar('網路錯誤，資料暫存本機','err');}
  setTimeout(()=>sbar(''),3500);
}

function chM(d){cur=new Date(cur.getFullYear(),cur.getMonth()+d,1);closeForm();render();}
function goToday(){cur=new Date(td.getFullYear(),td.getMonth(),1);sel=new Date(td.getFullYear(),td.getMonth(),td.getDate());closeForm();render();}

load();
</script>
</body>
</html>
